
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/z-u-s-h-o/film-react-nest/frontend:${IMAGE_TAG:-latest}
    container_name: film-frontend
    networks:
      - film-app-network
    volumes:
      - frontend_dist:/usr/share/nginx/html

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/z-u-s-h-o/film-react-nest/backend:${IMAGE_TAG:-latest}
    container_name: film-backend
    networks:
      - film-app-network
      - film-db-network
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_DRIVER: ${DATABASE_DRIVER}
      DATABASE_URL: postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_DRIVER}:5432/${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      LOG_FORMAT: ${LOG_FORMAT}
    depends_on:
      postgres:
        condition: service_healthy
        
  postgres:
    image: postgres:15-alpine
    container_name: film-postgres
    networks:
      - film-db-network
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    ports:
      - "8080:80"
    networks:
      - film-app-network
      - film-db-network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: film-nginx
    restart: on-failure
    ports:
      - "80:80"
    networks:
      - film-app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    # depends_on:
    #   frontend:
    #     condition: service_started
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

networks:
  film-app-network:
    driver: bridge
  film-db-network:
    driver: bridge
