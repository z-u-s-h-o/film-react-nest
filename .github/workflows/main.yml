name: Build and Push Docker Images

on:
  push:
    branches: [main, review-2]
  pull_request:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.sha }}
  REGISTRY: ghcr.io
  REPOSITORY: z-u-s-h-o/film-react-nest
  PROJECT_PATH: /home/zusho/film-project

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-,format=long

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Extract Docker metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-,format=long

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: contains('main,review-2', github.ref_name)

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd ${{ env.PROJECT_PATH }}

            if [ ! -f "docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found in ${{ env.PROJECT_PATH }}"
              exit 1
            
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose ps

            echo "Deployment completed successfully!"